name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Version = 1.0.<run number>; it goes up by itself on every build.
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: mv app/build/outputs/apk/release/app-release.apk MotionDownloader-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MotionDownloader-apk
          path: MotionDownloader-*.apk

      # Installed apps look for the newest release and offer the update.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Motion Downloader 1.0.${{ github.run_number }}
          body: Automatic build ${{ github.run_number }}
          files: MotionDownloader-*.apk
