name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FCM_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Version = 1.0.<run number>; it goes up by itself on every build.
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: mv app/build/outputs/apk/release/app-release.apk MotionDownloader-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MotionDownloader-apk
          path: MotionDownloader-*.apk

      # Installed apps look for the newest release and offer the update.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Motion Downloader 1.0.${{ github.run_number }}
          body: Automatic build ${{ github.run_number }}
          files: MotionDownloader-*.apk

      # Optional instant push to every phone (needs the FIREBASE_SERVICE_ACCOUNT secret, see OWNER_GUIDE.md).
      - name: Send push notification
        if: env.FCM_KEY != ''
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          info = json.loads(os.environ["FCM_KEY"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/firebase.messaging"])
          creds.refresh(Request())
          body = {"message": {"topic": "all", "notification": {
              "title": "Update available",
              "body": "Motion Downloader " + os.environ["VERSION"] + " is ready. Open the app to update."}}}
          r = requests.post("https://fcm.googleapis.com/v1/projects/" + info["project_id"] + "/messages:send",
                            headers={"Authorization": "Bearer " + creds.token}, json=body)
          print(r.status_code, r.text)
          PY
